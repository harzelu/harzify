<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #a020f0, #00c0ff);
    display: flex; justify-content: center; align-items: flex-start; padding: 32px 16px;
  }
  .card {
    background: #f4f4f4; width: 100%; max-width: 420px;
    border-radius: 32px; padding: 28px 20px 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  .initial {
    background: linear-gradient(135deg, #a020f0, #00c0ff); color: #fff;
    font-size: 3rem; font-weight: 700; display: flex !important;
    align-items: center; justify-content: center;
  }
  h1 { margin-bottom: 20px; }
  .avatar {
    width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
    display: block; margin: 0 auto 12px; border: 4px solid #fff;
  }
  h1 { text-align: center; font-size: 1.5rem; color: #222; }
  .tagline { text-align: center; font-style: italic; color: #444; margin: 4px 0 20px; }
  h2 {
    font-size: 1rem; color: #222; margin: 16px 0 10px;
    padding-bottom: 6px; border-bottom: 1px solid #ddd;
  }
  a.link {
    display: flex; align-items: center; gap: 16px;
    background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 10px;
    text-decoration: none; color: #222; font-size: 1rem;
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
    transition: transform .1s;
  }
  a.link:active { transform: scale(.98); }
  .icon { width: 24px; height: 24px; fill: var(--accent); flex-shrink: 0; }
</style>
